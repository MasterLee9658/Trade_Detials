<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMV Tracker | Nebula Dashboard</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes nebula-float {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.15; }
            33% { transform: scale(1.1) translate(2%, 4%); opacity: 0.25; }
            66% { transform: scale(0.9) translate(-4%, 2%); opacity: 0.1; }
        }
        .animate-nebula-slow { animation: nebula-float 20s ease-in-out infinite; }
        .animate-nebula-medium { animation: nebula-float 15s ease-in-out infinite reverse; }
        .animate-nebula-fast { animation: nebula-float 12s ease-in-out infinite; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); background-clip: content-box; }
        
        select option { background: #0f172a; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Icons Component Wrapper
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) lucide.createIcons();
            }, [name, size, className]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbXX2KrVtMfK6YO25OQDgvNv48jmfIXoQKq6weldXEBCPBzM6XQGR1F879lAueQOCghdhxOPZ2xj0E/pub?gid=0&single=true&output=csv";

        const COL = {
            A: 0, C: 2, G: 6, K: 10, T: 19, V: 21, AD: 29, AL: 37
        };

        const REQUESTED_COLUMNS = [2, 10, 11, 12, 13, 14, 18, 19, 20, 27, 29];

        const NebulaBackground = () => (
            <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none bg-[#020617]">
                <div className="absolute top-[-10%] left-[-10%] w-[70%] h-[70%] bg-purple-600/20 blur-[140px] rounded-full animate-nebula-slow" />
                <div className="absolute bottom-[-10%] right-[-10%] w-[80%] h-[80%] bg-blue-600/15 blur-[140px] rounded-full animate-nebula-medium" />
                <div className="absolute top-[30%] right-[5%] w-[50%] h-[50%] bg-pink-600/15 blur-[140px] rounded-full animate-nebula-fast" />
                <div className="absolute inset-0 opacity-40" style={{ backgroundImage: 'radial-gradient(circle at 1px 1px, rgba(255,255,255,0.4) 1px, transparent 0)', backgroundSize: '60px 60px' }} />
            </div>
        );

        const App = () => {
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [activeTab, setActiveTab] = useState('overview'); 
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [selectedMonth, setSelectedMonth] = useState('All');
            const [selectedSupply, setSelectedSupply] = useState('All');
            const [data, setData] = useState([]);
            const [headers, setHeaders] = useState([]);
            const [dynamicMonths, setDynamicMonths] = useState(['All']);
            const [dynamicSupplyValues, setDynamicSupplyValues] = useState(['All']);

            const fetchData = async () => {
                setIsRefreshing(true);
                try {
                    const response = await fetch(GOOGLE_SHEET_CSV_URL);
                    const csvText = await response.text();
                    const lines = csvText.split('\n').map(l => l.trim()).filter(l => l !== "");
                    
                    const rawRows = lines.map(line => line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/"/g, '')));
                    setHeaders(rawRows[0]);

                    const parsedData = rawRows.slice(1)
                        .filter(row => (row[COL.AD] || '').toLowerCase().trim() === 'closed')
                        .map((row, i) => {
                            const item = { id: i };
                            row.forEach((cell, idx) => item[`col_${idx}`] = cell);
                            return item;
                        });

                    const uniqueMonths = new Set();
                    const uniqueSupply = new Set();
                    parsedData.forEach(row => {
                        if(row[`col_${COL.G}`]) uniqueMonths.add(row[`col_${COL.G}`]);
                        if(row[`col_${COL.A}`]) uniqueSupply.add(row[`col_${COL.A}`]);
                    });

                    setDynamicMonths(['All', ...Array.from(uniqueMonths).sort()]);
                    setDynamicSupplyValues(['All', ...Array.from(uniqueSupply).sort()]);
                    setData(parsedData);
                } catch (e) { console.error(e); }
                setIsRefreshing(false);
            };

            useEffect(() => { fetchData(); }, []);

            const filteredData = useMemo(() => {
                return data.filter(row => {
                    const matchMonth = selectedMonth === 'All' || row[`col_${COL.G}`] === selectedMonth;
                    const matchSupply = selectedSupply === 'All' || row[`col_${COL.A}`] === selectedSupply;
                    return matchMonth && matchSupply;
                });
            }, [data, selectedMonth, selectedSupply]);

            const analytics = useMemo(() => {
                const groups = {};
                filteredData.forEach(row => {
                    const nameKey = row[`col_${COL.C}`] || 'Unknown Entity';
                    const cat = (row[`col_${COL.AL}`] || '').toLowerCase();
                    const parseNum = (v) => parseFloat((v || '0').replace(/[^0-9.-]+/g, "")) || 0;

                    if (!groups[nameKey]) groups[nameKey] = { name: nameKey, gmv: 0, margin: 0, commerce: 0, capital: 0, known: 0, partLoad: 0, perfValue: 0 };
                    groups[nameKey].gmv += parseNum(row[`col_${COL.T}`]);
                    groups[nameKey].margin += parseNum(row[`col_${COL.V}`]);
                    groups[nameKey].perfValue += parseNum(row[`col_${COL.K}`]); // Performance tracking based on Col K
                    
                    if (cat.includes('commerce')) groups[nameKey].commerce++;
                    if (cat.includes('capital')) groups[nameKey].capital++;
                    if (cat.includes('known')) groups[nameKey].known++;
                    if (cat.includes('part load')) groups[nameKey].partLoad++;
                });
                
                const sorted = Object.values(groups).sort((a, b) => b.gmv - a.gmv);
                const perfSorted = [...Object.values(groups)].sort((a, b) => b.perfValue - a.perfValue);
                
                return {
                    table: sorted,
                    highPerf: perfSorted[0] || null,
                    lowPerf: perfSorted[perfSorted.length - 1] || null
                };
            }, [filteredData]);

            const formatCurrency = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
            const glassStyle = "bg-white/10 backdrop-blur-xl border border-white/10 shadow-2xl";

            return (
                <div className="min-h-screen relative flex text-white font-sans">
                    <NebulaBackground />
                    <aside className={`${isSidebarOpen ? 'w-64' : 'w-20'} bg-black/40 backdrop-blur-2xl border-r border-white/5 transition-all fixed h-full z-30`}>
                        <div className="p-6 flex items-center gap-3">
                            <div className="bg-indigo-500 p-2 rounded-lg"><Icon name="file-spreadsheet" /></div>
                            {isSidebarOpen && <span className="font-bold text-xl tracking-tight">GMV Tracker</span>}
                        </div>
                        <nav className="p-4 space-y-2">
                            <button onClick={() => setActiveTab('overview')} className={`w-full flex items-center gap-4 p-3 rounded-xl transition-colors ${activeTab === 'overview' ? 'bg-white/20' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="table" /> {isSidebarOpen && "Data Table"}
                            </button>
                            <button onClick={() => setActiveTab('reports')} className={`w-full flex items-center gap-4 p-3 rounded-xl transition-colors ${activeTab === 'reports' ? 'bg-white/20' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="pie-chart" /> {isSidebarOpen && "Analytics"}
                            </button>
                        </nav>
                    </aside>

                    <main className={`flex-1 ${isSidebarOpen ? 'ml-64' : 'ml-20'} relative z-10 transition-all`}>
                        <header className="bg-white/5 backdrop-blur-2xl border-b border-white/5 p-5 flex justify-between items-center">
                            <h1 className="text-lg font-black uppercase tracking-widest">{activeTab === 'overview' ? 'Operational Records' : 'Performance Analytics'}</h1>
                            <button onClick={fetchData} className="p-2 bg-white/10 rounded-xl hover:bg-white/20 transition-transform active:scale-95">
                                <Icon name="refresh-cw" className={isRefreshing ? "animate-spin" : ""} />
                            </button>
                        </header>

                        <div className="p-8 space-y-6">
                            {/* Performance Cards based on Column K (as seen in your images) */}
                            {activeTab === 'reports' && analytics.highPerf && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    <div className={`${glassStyle} p-6 rounded-3xl relative overflow-hidden group`}>
                                        <div className="flex items-center gap-4 mb-4">
                                            <div className="p-3 bg-indigo-500/20 rounded-2xl text-indigo-400">
                                                <Icon name="zap" size={24} />
                                            </div>
                                            <span className="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-300">High Performance Logic (Col K)</span>
                                        </div>
                                        <div className="bg-indigo-500/10 px-3 py-1 rounded-lg inline-block text-[10px] font-black text-indigo-300 mb-4">RANK #1 (HIGHEST)</div>
                                        <div className="text-[10px] uppercase text-white/40 mb-1">Name (Col C)</div>
                                        <h2 className="text-2xl font-black mb-2">{analytics.highPerf.name}</h2>
                                        <div className="text-3xl font-black text-indigo-400">{analytics.highPerf.perfValue} Units</div>
                                        <Icon name="trophy" className="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity" size={120} />
                                    </div>

                                    <div className={`${glassStyle} p-6 rounded-3xl relative overflow-hidden group border-rose-500/20`}>
                                        <div className="flex items-center gap-4 mb-4">
                                            <div className="p-3 bg-rose-500/20 rounded-2xl text-rose-400">
                                                <Icon name="activity" size={24} />
                                            </div>
                                            <span className="text-[10px] font-black uppercase tracking-[0.2em] text-rose-300">Low Performance Logic (Col K)</span>
                                        </div>
                                        <div className="bg-rose-500/10 px-3 py-1 rounded-lg inline-block text-[10px] font-black text-rose-300 mb-4">LAST RANK (LOWEST)</div>
                                        <div className="text-[10px] uppercase text-white/40 mb-1">Name (Col C)</div>
                                        <h2 className="text-2xl font-black mb-2">{analytics.lowPerf.name}</h2>
                                        <div className="text-3xl font-black text-rose-400">{analytics.lowPerf.perfValue} Units</div>
                                        <Icon name="target" className="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity" size={120} />
                                    </div>
                                </div>
                            )}

                            <div className={`${glassStyle} p-4 rounded-2xl flex flex-wrap gap-4 items-center`}>
                                <div className="flex items-center gap-2 px-3 py-2 bg-white/5 rounded-xl border border-white/10">
                                    <span className="text-[10px] font-black text-indigo-300 uppercase">Month</span>
                                    <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-transparent text-sm font-bold outline-none cursor-pointer">
                                        {dynamicMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center gap-2 px-3 py-2 bg-white/5 rounded-xl border border-white/10">
                                    <span className="text-[10px] font-black text-indigo-300 uppercase">Supply</span>
                                    <select value={selectedSupply} onChange={e => setSelectedSupply(e.target.value)} className="bg-transparent text-sm font-bold outline-none cursor-pointer">
                                        {dynamicSupplyValues.map(v => <option key={v} value={v}>{v}</option>)}
                                    </select>
                                </div>
                            </div>

                            {activeTab === 'overview' ? (
                                <div className={`${glassStyle} rounded-2xl overflow-hidden overflow-x-auto custom-scrollbar`}>
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-white/5">
                                            <tr>{REQUESTED_COLUMNS.map(i => <th key={i} className="p-4 text-[10px] font-black text-indigo-200 uppercase tracking-widest whitespace-nowrap">{headers[i] || `Col ${i}`}</th>)}</tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/5">
                                            {filteredData.map(row => (
                                                <tr key={row.id} className="hover:bg-white/5 transition-colors">
                                                    {REQUESTED_COLUMNS.map(i => <td key={i} className="p-4 text-sm font-medium opacity-90 whitespace-nowrap">{row[`col_${i}`]}</td>)}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className={`${glassStyle} rounded-3xl overflow-hidden overflow-x-auto custom-scrollbar`}>
                                    <table className="w-full text-left">
                                        <thead className="bg-white/5 text-[10px] font-black text-indigo-300">
                                            <tr>
                                                <th className="p-6 tracking-widest">ENTITY NAME</th>
                                                <th className="p-6 text-center">COMMERCE</th>
                                                <th className="p-6 text-center">CAPITAL</th>
                                                <th className="p-6 text-center">KNOWN</th>
                                                <th className="p-6 text-center">PART LOAD</th>
                                                <th className="p-6 text-right text-emerald-400">GMV (COL T)</th>
                                                <th className="p-6 text-right text-rose-400">MARGIN (COL V)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/5">
                                            {analytics.table.map(item => (
                                                <tr key={item.name} className="hover:bg-white/10 transition-colors">
                                                    <td className="p-6 font-black text-sm">{item.name}</td>
                                                    <td className="p-6 text-center">
                                                        <span className={`inline-block w-8 h-8 leading-8 rounded-lg text-xs font-black ${item.commerce > 0 ? 'bg-indigo-500/40 text-white shadow-lg' : 'opacity-10 border border-white/20'}`}>{item.commerce}</span>
                                                    </td>
                                                    <td className="p-6 text-center">
                                                        <span className={`inline-block w-8 h-8 leading-8 rounded-lg text-xs font-black ${item.capital > 0 ? 'bg-indigo-500/40 text-white shadow-lg' : 'opacity-10 border border-white/20'}`}>{item.capital}</span>
                                                    </td>
                                                    <td className="p-6 text-center">
                                                        <span className={`inline-block w-8 h-8 leading-8 rounded-lg text-xs font-black ${item.known > 0 ? 'bg-indigo-500/40 text-white shadow-lg' : 'opacity-10 border border-white/20'}`}>{item.known}</span>
                                                    </td>
                                                    <td className="p-6 text-center">
                                                        <span className={`inline-block w-8 h-8 leading-8 rounded-lg text-xs font-black ${item.partLoad > 0 ? 'bg-indigo-500/40 text-white shadow-lg' : 'opacity-10 border border-white/20'}`}>{item.partLoad}</span>
                                                    </td>
                                                    <td className="p-6 text-right font-mono text-emerald-400 font-bold">{formatCurrency(item.gmv)}</td>
                                                    <td className="p-6 text-right font-mono text-rose-400 font-bold">{formatCurrency(item.margin)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
